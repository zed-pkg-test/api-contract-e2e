    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify all 65 exact source Git blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src -type f | wc -l | tr -d '[:space:]')" = "30"
          while read -r sha path; do
            test -f "$path"
            test "$(git hash-object "$path")" = "$sha" || { echo "SHA mismatch: $path"; exit 1; }
