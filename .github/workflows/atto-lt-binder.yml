          EXPECTED_SOURCE
          git fsck --full --strict --no-reflogs
          echo "source_head=11b62578355c8e216edc56ce6ecab7de75e4bbba"
          echo "selected_blobs=65; 100% selected source Git blobs matched"
          echo "Focused compiler/fixture source slice, not full repository mirror"
      - name: Install Rust 1.85.1 and wasm32, formatter, Clippy
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup component add rustfmt clippy --toolchain 1.85.1
          rustup default 1.85.1
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Check new class loan scanner rustfmt
        run: rustfmt --edition 2021 --check src/check/loan_liveness.rs
      - name: Clippy native compiler source (pre-existing unrelated warnings reported)
        run: cargo clippy --locked --lib --bin attoc
      - name: Rust compiler library tests
        run: cargo test --locked --lib
      - name: Typed class-loan provenance integration tests
        run: cargo test --locked --test class_loan_typed_ir
      - name: Checked-handle prefix AST and fail-closed tests
        run: cargo test --locked --test checked_handle_prefix_syntax
      - name: Lifetime syntax regression tests
        run: cargo test --locked --test lifetime_binder_syntax
      - name: Adversarial lt! parser and deterministic fuzz tests
        run: cargo test --locked --test lifetime_binder_hardening
      - name: Native release compiler
        run: cargo build --locked --release --bin attoc
      - name: Independent standalone wasm32 release compiler
        run: |
          cargo rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          sha256sum target/wasm32-unknown-unknown/release/atto_compiler.wasm
      - name: Execute actual class-loan NLL guest regressions and differential native/Wasm decisions
        env:
          ATTOC: target/release/attoc
        run: node tests/class_nll_selected.mjs
