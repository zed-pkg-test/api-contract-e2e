name: Flat TypeSpec JSON Schema peer authority

on:
  pull_request:
    paths:
      - 'contracts/typespec/flat-widget.tsp'
      - 'contracts/json-schema/flat-widget.schema.json'
      - 'contracts/flat-peer-instances/**'
      - '.github/workflows/flat-peer-authority.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/typespec/flat-widget.tsp'
      - 'contracts/json-schema/flat-widget.schema.json'
      - 'contracts/flat-peer-instances/**'
      - '.github/workflows/flat-peer-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TJSV_SHA: b53a9b7389b02768700ef220a8843c9302182e5a
  TSP: contracts/typespec/flat-widget.tsp
  SCHEMA: contracts/json-schema/flat-widget.schema.json
  INSTANCES: contracts/flat-peer-instances

jobs:
  peer-authority-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact canary head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out exact TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_SHA }}
          path: .tjsv
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0

      - name: Install pinned TJSV closure
        run: npm ci --prefix .tjsv

      - name: Admit independent authored peers
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/flat-peer-baseline"
          mkdir -p "$evidence/generated"
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec "$TSP" \
            --schema "$SCHEMA" \
            --instances "$INSTANCES" \
            --output-dir "$evidence/generated" \
            --bundle-id typespec.generated.schema.json \
            --report "$evidence/report.json" \
            --contract-ir "$evidence/contract-ir.json" \
            --quiet
          test -s "$evidence/generated/typespec.generated.schema.json"
          test -s "$evidence/report.json"
          test -s "$evidence/contract-ir.json"
          jq -e '
            .status == "passed" and
            .authorities.typespec.authority == "independently-authored" and
            .authorities.typespec.generatedJsonSchemaRole == "comparison-evidence-only" and
            .authorities.jsonSchema.authority == "independently-authored" and
            .authorities.jsonSchema.dialect == "https://json-schema.org/draft/2020-12/schema" and
            .authorities.precedence == "none" and
            .coverage.typespecGeneratedJsonSchemaComparison == true and
            .coverage.differentialInstanceValidation == true and
            .differential.summary.divergences == 0 and
            .zeroUnexplainedFindings == true
          ' "$evidence/report.json"
          test ! -e contracts/typespec/typespec.generated.schema.json
          test ! -e contracts/json-schema/typespec.generated.schema.json

      - name: Reject TypeSpec-only drift
        shell: bash
        run: |
          set -Eeuo pipefail
          drift="$RUNNER_TEMP/flat-peer-typespec-drift.tsp"
          evidence="$RUNNER_TEMP/flat-peer-typespec-drift"
          cp "$TSP" "$drift"
          sed -i 's/enabled: boolean;/enabled: string;/' "$drift"
          mkdir -p "$evidence/generated"
          set +e
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec "$drift" \
            --schema "$SCHEMA" \
            --instances "$INSTANCES" \
            --output-dir "$evidence/generated" \
            --bundle-id typespec.generated.schema.json \
            --report "$evidence/report.json" \
            --contract-ir "$evidence/contract-ir.json" \
            --quiet
          status=$?
          set -e
          test "$status" -ne 0
          jq -e '.status == "stopped_for_evaluation" and .zeroUnexplainedFindings == false' "$evidence/report.json"

      - name: Reject JSON-Schema-only drift
        shell: bash
        run: |
          set -Eeuo pipefail
          drift="$RUNNER_TEMP/flat-peer-schema-drift.json"
          evidence="$RUNNER_TEMP/flat-peer-schema-drift"
          jq '."$defs".FlatWidget.properties.enabled.type = "string"' "$SCHEMA" > "$drift"
          mkdir -p "$evidence/generated"
          set +e
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec "$TSP" \
            --schema "$drift" \
            --instances "$INSTANCES" \
            --output-dir "$evidence/generated" \
            --bundle-id typespec.generated.schema.json \
            --report "$evidence/report.json" \
            --contract-ir "$evidence/contract-ir.json" \
            --quiet
          status=$?
          set -e
          test "$status" -ne 0
          jq -e '.status == "stopped_for_evaluation" and .zeroUnexplainedFindings == false' "$evidence/report.json"

      - name: Prove authored authorities were not rewritten
        run: git diff --exit-code -- "$TSP" "$SCHEMA" "$INSTANCES"
