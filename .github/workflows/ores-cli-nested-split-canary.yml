name: ores-cli nested split peer-contract canary

on:
  pull_request:
    paths:
      - '.github/workflows/ores-cli-nested-split-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-nested-split-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out exact ores-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-cli
          ref: dd58a8ef975799f511758272fbbcbe9aeaacbd57
          path: candidate
          persist-credentials: false
          token: ${{ secrets.TEST_FLEET_READ_TOKEN || github.token }}

      - name: Verify exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 'dd58a8ef975799f511758272fbbcbe9aeaacbd57'
          grep -Fq 'mod nested_split_peer_contracts;' candidate/src/audit/mod.rs
          grep -Fq 'augment_nested_split_peer_contract_audit(options, report)' candidate/src/audit/mod.rs
          grep -Fq 'generated_schema_is_evidence_not_an_authored_peer' candidate/src/audit/nested_split_peer_contracts.rs

      - name: Install ores-cli MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy

      - name: Require rustfmt-clean candidate
        run: cargo +1.88.0 fmt --manifest-path candidate/Cargo.toml --all -- --check

      - name: Execute flat split peer-contract regressions
        run: cargo +1.88.0 test --manifest-path candidate/Cargo.toml --locked --lib split_peer_contracts::tests

      - name: Execute Claritas-style nested split regressions
        run: cargo +1.88.0 test --manifest-path candidate/Cargo.toml --locked --lib nested_split_peer_contracts::tests

      - name: Compile full library at declared MSRV
        run: cargo +1.88.0 check --manifest-path candidate/Cargo.toml --locked --lib

      - name: Deny Clippy warnings in library
        run: cargo +1.88.0 clippy --manifest-path candidate/Cargo.toml --locked --lib -- -D warnings
