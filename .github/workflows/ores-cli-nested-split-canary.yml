name: nested split peer-contract fixture

on:
  pull_request:
    paths:
      - '.github/workflows/ores-cli-nested-split-canary.yml'
      - 'contracts/claritas-nested-fixture/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nested-split-peer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TJSV_SHA: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405

jobs:
  fixture-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove Claritas-style nested authority layout
        shell: bash
        run: |
          set -Eeuo pipefail
          root='contracts/claritas-nested-fixture'
          test -s "$root/typespec/main.tsp"
          test -s "$root/json-schema/visualization-query.schema.json"
          test ! -e "$root/json-schema/typespec.generated.schema.json"
          test "$(find "$root/typespec" -maxdepth 1 -type f -name 'main.tsp' | wc -l)" -eq 1
          test "$(find "$root/json-schema" -maxdepth 1 -type f -name '*.schema.json' ! -name '*.generated.*' | wc -l)" -eq 1
          grep -Fq 'https://json-schema.org/draft/2020-12/schema' "$root/json-schema/visualization-query.schema.json"
          sha256sum \
            "$root/typespec/main.tsp" \
            "$root/json-schema/visualization-query.schema.json" \
            > "$RUNNER_TEMP/nested-authorities.before.sha256"

      - name: Compile TypeSpec to comparison Schema B and compare with authored Schema A
        uses: ORESoftware/typespec-json-schema-validator@93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
        with:
          typespec: contracts/claritas-nested-fixture/typespec/main.tsp
          schema: contracts/claritas-nested-fixture/json-schema/visualization-query.schema.json
          report: tmp/nested-positive/report.json
          sarif: tmp/nested-positive/report.sarif
          contract_ir: tmp/nested-positive/contract-ir.json
          output_dir: tmp/nested-positive/generated
          max_probes: '64'

      - name: Re-verify declaration admission against both authored peers
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
        with:
          contract_ir: tmp/nested-positive/contract-ir.json
          report: tmp/nested-positive/report.json
          typespec: contracts/claritas-nested-fixture/typespec/main.tsp
          schema: contracts/claritas-nested-fixture/json-schema/visualization-query.schema.json
          generated_schema: tmp/nested-positive/generated/typespec.generated.schema.json
          expected_declarations: '["ClaritasVisualizationQuery.VisualizationQueryV1"]'
          verification: tmp/nested-positive/verification.json

      - name: Assert first-class peer authority roles and executed Schema-B comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { readFile, realpath } from 'node:fs/promises';
          const [ir, report, authoredReal, generatedReal] = await Promise.all([
            readFile('tmp/nested-positive/contract-ir.json', 'utf8').then(JSON.parse),
            readFile('tmp/nested-positive/report.json', 'utf8').then(JSON.parse),
            realpath('contracts/claritas-nested-fixture/json-schema/visualization-query.schema.json'),
            realpath('tmp/nested-positive/generated/typespec.generated.schema.json'),
          ]);
          const expected = {
            typespec: 'independently-authored',
            jsonSchema: 'independently-authored',
            generatedJsonSchema: 'comparison-evidence-only',
            precedence: 'none',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (ir.authorities?.[key] !== value) {
              throw new Error(`unexpected Contract IR authority ${key}: ${JSON.stringify(ir.authorities?.[key])}`);
            }
          }
          if (report.authorities?.typespec?.authority !== 'independently-authored') {
            throw new Error('TypeSpec was not retained as an independent authority');
          }
          if (report.authorities?.jsonSchema?.authority !== 'independently-authored') {
            throw new Error('JSON Schema was not retained as an independent authority');
          }
          if (report.authorities?.precedence !== 'none') {
            throw new Error('one authored authority was assigned precedence');
          }
          if (report.authorities?.typespec?.generatedJsonSchemaRole !== 'comparison-evidence-only') {
            throw new Error('generated Schema B was promoted beyond comparison evidence');
          }
          if (report.coverage?.typespecGeneratedJsonSchemaComparison !== true) {
            throw new Error('generated Schema B versus authored Schema A comparison did not execute');
          }
          if (authoredReal === generatedReal) {
            throw new Error('authored Schema A aliases generated Schema B');
          }
          NODE

      - name: Prove generated Schema B stayed outside authored JSON Schema lane
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s tmp/nested-positive/generated/typespec.generated.schema.json
          test ! -e contracts/claritas-nested-fixture/json-schema/typespec.generated.schema.json
          git diff --exit-code -- contracts/claritas-nested-fixture/typespec/main.tsp contracts/claritas-nested-fixture/json-schema/visualization-query.schema.json
          node <<'NODE'
          const fs = require('node:fs');
          const input = 'contracts/claritas-nested-fixture/json-schema/visualization-query.schema.json';
          const drift = JSON.parse(fs.readFileSync(input, 'utf8'));
          drift.$defs.VisualizationQueryV1.properties.limit.maximum = 499;
          fs.mkdirSync('tmp/nested-negative', {recursive: true});
          fs.writeFileSync('tmp/nested-negative/authored-drift.schema.json', `${JSON.stringify(drift, null, 2)}\n`);
          NODE

      - name: One-sided authored JSON Schema drift must fail
        id: json_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
        with:
          typespec: contracts/claritas-nested-fixture/typespec/main.tsp
          schema: tmp/nested-negative/authored-drift.schema.json
          report: tmp/nested-negative/report.json
          sarif: tmp/nested-negative/report.sarif
          contract_ir: tmp/nested-negative/contract-ir.json
          output_dir: tmp/nested-negative/generated
          max_probes: '32'

      - name: Require authored JSON Schema drift refusal after A/B comparison
        if: always()
        env:
          DRIFT_OUTCOME: ${{ steps.json_drift.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$DRIFT_OUTCOME" = failure
          test -s tmp/nested-negative/generated/typespec.generated.schema.json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('tmp/nested-negative/report.json', 'utf8'));
          if (report.status !== 'stopped_for_evaluation') throw new Error(`unexpected status: ${JSON.stringify(report.status)}`);
          if (report.coverage?.typespecGeneratedJsonSchemaComparison !== true) throw new Error('JSON-only drift did not execute Schema-B versus Schema-A comparison');
          NODE

      - name: Prepare TypeSpec-only drift without editing either authority
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tmp/nested-typespec-negative
          sed 's/@maxValue(500)/@maxValue(499)/' \
            contracts/claritas-nested-fixture/typespec/main.tsp \
            > tmp/nested-typespec-negative/drift.tsp
          grep -Fq '@maxValue(499)' tmp/nested-typespec-negative/drift.tsp
          grep -Fq '@maxValue(500)' contracts/claritas-nested-fixture/typespec/main.tsp

      - name: One-sided TypeSpec drift must fail after transpilation to Schema B
        id: typespec_drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
        with:
          typespec: tmp/nested-typespec-negative/drift.tsp
          schema: contracts/claritas-nested-fixture/json-schema/visualization-query.schema.json
          report: tmp/nested-typespec-negative/report.json
          sarif: tmp/nested-typespec-negative/report.sarif
          contract_ir: tmp/nested-typespec-negative/contract-ir.json
          output_dir: tmp/nested-typespec-negative/generated
          max_probes: '32'

      - name: Require TypeSpec-only drift refusal after transpilation and A/B comparison
        if: always()
        env:
          DRIFT_OUTCOME: ${{ steps.typespec_drift.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$DRIFT_OUTCOME" = failure
          test -s tmp/nested-typespec-negative/generated/typespec.generated.schema.json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('tmp/nested-typespec-negative/report.json', 'utf8'));
          if (report.status !== 'stopped_for_evaluation') throw new Error(`unexpected status: ${JSON.stringify(report.status)}`);
          if (report.coverage?.typespecGeneratedJsonSchemaComparison !== true) throw new Error('TypeSpec-only drift did not execute generated Schema-B versus authored Schema-A comparison');
          NODE

      - name: Require immutable authored peers after positive and negative lanes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum \
            contracts/claritas-nested-fixture/typespec/main.tsp \
            contracts/claritas-nested-fixture/json-schema/visualization-query.schema.json \
            > "$RUNNER_TEMP/nested-authorities.after.sha256"
          cmp "$RUNNER_TEMP/nested-authorities.before.sha256" "$RUNNER_TEMP/nested-authorities.after.sha256"
          git diff --exit-code -- \
            contracts/claritas-nested-fixture/typespec/main.tsp \
            contracts/claritas-nested-fixture/json-schema/visualization-query.schema.json
