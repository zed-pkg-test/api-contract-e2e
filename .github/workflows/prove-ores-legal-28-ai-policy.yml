name: prove ores-legal 28 AI policy

on:
  pull_request:
    paths:
      - "fixtures/promotion/ores-legal-28/**"
      - ".github/workflows/prove-ores-legal-28-ai-policy.yml"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact proof head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
      - name: Compare mirrored AI-policy peer authorities
        uses: ORESoftware/typespec-json-schema-validator@dfc28bfc000faba5a963f23c708171dfd5f8debf
        with:
          typespec: fixtures/promotion/ores-legal-28/ai-policy/main.tsp
          schema: fixtures/promotion/ores-legal-28/ai-policy/authored.schema.json
          report: .typespec-json-schema-validator/ores-legal-28/report.json
          contract_ir: .typespec-json-schema-validator/ores-legal-28/contract-ir.json
          output_dir: .typespec-json-schema-validator/ores-legal-28/generated
          max_probes: "256"
          quiet: "true"
      - name: Require zero divergence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const report = JSON.parse(readFileSync('.typespec-json-schema-validator/ores-legal-28/report.json', 'utf8'));
          if (report.status !== 'passed') throw new Error(`status=${report.status}`);
          if (report.zeroUnexplainedFindings !== true) throw new Error('unexplained findings');
          if (report.authorities?.precedence !== 'none') throw new Error('peer authority precedence forbidden');
          if (report.differential?.summary?.divergences !== 0) throw new Error('differential divergence');
          if (report.differential?.summary?.refusals !== 0) throw new Error('differential refusal');
          console.log(JSON.stringify(report.differential?.summary ?? {}, null, 2));
          NODE
      - name: Record source binding
        shell: bash
        run: |
          set -euo pipefail
          git hash-object fixtures/promotion/ores-legal-28/ai-policy/main.tsp
          git hash-object fixtures/promotion/ores-legal-28/ai-policy/authored.schema.json
          echo "source_repo=ores-legal/ores-legal-interfaces"
          echo "source_head=cea162a3ebb04439adb5893a126450ac697fa58b"
          echo "source_pr=28"
