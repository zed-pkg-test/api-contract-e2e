name: takoda-daemon-exact-head-audit

on:
  pull_request:
  push:
    branches:
      - "audit/takoda-daemon-95518"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: takoda-daemon-exact-head-audit
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: takoda-automation/tkda-desktop-daemon
          ref: 95518dd83050f2ea764b00b16caad45e8fa72bf7
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify exact candidate head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "95518dd83050f2ea764b00b16caad45e8fa72bf7"
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings -A clippy::needless-return -A clippy::match-like-matches-macro
      - name: Test
        run: cargo test --all-targets --locked
